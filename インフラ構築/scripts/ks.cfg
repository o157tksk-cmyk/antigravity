# ==============================================================================
# Rocky Linux 9 無人インストール応答ファイル (Kickstart / ks.cfg - UEFI対応版)
# ==============================================================================

# インストールモード
text
cdrom

# 自動電源オフ
poweroff

# 言語・ロケール設定
lang ja_JP.UTF-8
keyboard jp106
timezone Asia/Tokyo --utc

# ネットワーク初期設定 (内部静的IP)
network --bootproto=static --ip=192.168.10.20 --netmask=255.255.255.0 --gateway=192.168.10.1 --nameserver=192.168.10.10 --device=link --activate --onboot=on

# 認証設定
rootpw --plaintext P@ssw0rd2022!
authselect select minimal

# ファイアウォール・SELinux
firewall --enabled --ssh --http --service=dns,smtp,imap
selinux --enforcing

# ディスクパーティション設定 (Hyper-V 第2世代 UEFI 専用)
clearpart --all --initlabel
bootloader --timeout=1
part /boot/efi --fstype="efi" --size=600 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype="xfs" --size=1024
part / --fstype="xfs" --grow --size=2048

# システムサービスの制御
services --enabled="sshd,NetworkManager,chronyd"

# インストールパッケージ選択
%packages
@^minimal-environment
@core
grub2-efi-x64
shim-x64
efibootmgr
openssh-server
openssh-clients
bind-utils
curl
wget
vim-enhanced
tar
sudo
chrony
net-tools
rsync
%end

# インストール後処理 (UEFIフォールバック・一般化)
%post --log=/root/ks-post.log
echo "=== Rocky Linux 9 UEFI & 一般化セットアップ ==="

# 1. Hyper-V 第2世代VM用 UEFI フォールバックブートローダーのコピー
mkdir -p /boot/efi/EFI/BOOT
if [ -f /boot/efi/EFI/rocky/shimx64.efi ]; then
    cp /boot/efi/EFI/rocky/shimx64.efi /boot/efi/EFI/BOOT/BOOTX64.EFI
    cp /boot/efi/EFI/rocky/grubx64.efi /boot/efi/EFI/BOOT/grubx64.efi || true
fi

# 2. SSH rootログイン許可
sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config || true
sed -i 's/^PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config || true

# 3. SSH ホストキーの再生成準備
rm -f /etc/ssh/ssh_host_*
ssh-keygen -A

# 4. Machine ID の初期化
truncate -s 0 /etc/machine-id
rm -f /var/lib/dbus/machine-id

# 5. パッケージキャッシュ & 一時ファイルのクリーンアップ
dnf clean all
rm -rf /var/cache/dnf
rm -rf /tmp/*
rm -rf /var/tmp/*

echo "=== ゴールデンイメージ作成完了 ==="
%end
