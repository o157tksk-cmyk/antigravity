# ==============================================================================
# Rocky Linux 10 Kickstart 無人インストール構成ファイル (ks.cfg)
# ==============================================================================

# インストールモード
text
eula --agreed

# 言語・キーボード・タイムゾーン
lang ja_JP.UTF-8
keyboard jp106
timezone Asia/Tokyo --utc

# ネットワーク設定
network --bootproto=static --ip=192.168.10.20 --netmask=255.255.255.0 --gateway=192.168.10.1 --nameserver=192.168.10.10 --hostname=rocky10-web --activate

# ルートパスワード (P@ssw0rd2022!)
rootpw --plaintext P@ssw0rd2022!

# ディスク自動パーティション構成
zerombr
clearpart --all --initlabel
autopart --type=lvm

# インストールパッケージ
%packages
@core
httpd
firewalld
openssh-server
python3
%end

# インストール後の自動実行設定
%post
systemctl enable sshd
systemctl enable httpd
systemctl enable firewalld
%end

reboot
