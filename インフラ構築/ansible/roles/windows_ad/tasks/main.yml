---
# ==============================================================================
# Ansible Role: windows_ad (Active Directory hogehoge.local)
# ==============================================================================

- name: Install AD DS Features and Management Tools
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - RSAT-AD-Tools
    state: present
  register: ad_feature_install

- name: Create Active Directory Domain (hogehoge.local)
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    safe_mode_password: "{{ dsrm_password }}"
    domain_netbios_name: "{{ domain_netbios }}"
    create_dns_delegation: false
  register: domain_install

- name: Reboot Windows Server after AD DS promotion
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: domain_install.changed
